name: Build D.A Barber
on:
  push:
    branches: ["main"]
    paths:
      - "barber/**"
      - ".github/workflows/barber-build.yml"
  workflow_dispatch:
concurrency:
  group: da-barber-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "13114758"
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.0"
      - name: Build
        working-directory: barber
        run: gradle --no-daemon assembleRelease
      - name: Locate APK
        working-directory: barber
        run: |
          find build/outputs -type f -name "*.apk" -print
          APK_COUNT=$(find build/outputs -type f -name "*.apk" | wc -l)
          test "$APK_COUNT" -ge 1
      - uses: actions/upload-artifact@v4
        with:
          name: DA-Barber-0.3
          path: barber/build/outputs/apk/release/*.apk
          if-no-files-found: error