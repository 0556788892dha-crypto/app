name: Build D.A Barber
on:
  push:
    branches: ["main"]
    paths:
      - "barber/**"
      - ".github/workflows/barber-build.yml"
  workflow_dispatch:
concurrency:
  group: da-barber-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build
        working-directory: barber
        run: gradle --no-daemon assembleRelease
      - name: Locate APK
        working-directory: barber
        run: |
          find build/outputs -type f -name "*.apk" -print
          APK_COUNT=$(find build/outputs -type f -name "*.apk" | wc -l)
          test "$APK_COUNT" -ge 1
      - uses: actions/upload-artifact@v4
        with:
          name: DA-Barber-0.3
          path: barber/build/outputs/apk/release/*.apk
          if-no-files-found: error