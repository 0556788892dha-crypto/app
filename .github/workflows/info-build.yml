name: DA INFO Android APK build

on:
  push:
    branches: [ main ]
    paths:
      - 'info/**'
      - '.github/workflows/info-build.yml'
      - 'build.gradle'
      - 'settings.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate knowledge database JSON
        run: |
          python3 - <<'PY'
          import json, re
          with open('info/src/main/assets/data.json', encoding='utf-8') as f:
              data = json.load(f)
          extra_path = 'info/src/main/assets/data_v1_1.json'
          with open(extra_path, encoding='utf-8') as f:
              extra = json.load(f)
          base_items = [item for category in data['categories'] for item in category['items']]
          extra_items = [item for category in extra['categories'] for item in category['items']]
          items = base_items + extra_items
          assert len(data['categories']) >= 15, 'Expected at least 15 categories'
          assert len(extra_items) >= 300, f'Expected at least 300 new v1.1 entries, got {len(extra_items)}'
          assert len(items) >= 2300, f'Expected at least 2300 total entries, got {len(items)}'
          base_titles = {item['title'].strip().lower() for item in base_items}
          extra_titles = [item['title'].strip().lower() for item in extra_items]
          assert not base_titles.intersection(extra_titles), 'v1.1 entries duplicate existing titles'
          extra_bodies = [' '.join(item['body'].lower().split()) for item in extra_items]
          assert len(extra_bodies) == len(set(extra_bodies)), 'Duplicate v1.1 article bodies detected'
          assert all(item.get('title', '').strip() and item.get('body', '').strip() and item.get('subcategory', '').strip() for item in items), 'An entry is missing title, body, or subcategory'
          assert not any(re.search(r'מדריך\s+\d+', item['title']) for item in items), 'Template filler title detected'
          bodies = [' '.join(item['body'].lower().split()) for item in items]
          titles = [item['title'].strip().lower() for item in items]
          assert len(bodies) == len(set(bodies)), 'Duplicate article bodies detected'
          assert len(titles) == len(set(titles)), 'Duplicate article titles detected'
          assert all(len(item['body'].strip()) >= 45 for item in items), 'Article body too short'
          print(f"Valid JSON: {len(data['categories'])} categories, {len(items)} entries; no template titles or duplicate titles/bodies.")
          PY
      - name: Build DA INFO debug APK
        run: gradle :info:assembleDebug --no-daemon
      - name: Check APK output
        run: |
          ls -lh info/build/outputs/apk/debug/*.apk
          test -s info/build/outputs/apk/debug/*.apk
          cp info/build/outputs/apk/debug/*.apk info/build/outputs/apk/debug/DA_INFO_v1.2.apk
          test -s info/build/outputs/apk/debug/DA_INFO_v1.2.apk
      - name: Upload DA INFO APK
        uses: actions/upload-artifact@v4
        with:
          name: DA-INFO-v1.2-APK
          path: info/build/outputs/apk/debug/DA_INFO_v1.2.apk
          if-no-files-found: error
          retention-days: 14
