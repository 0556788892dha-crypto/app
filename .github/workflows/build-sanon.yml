name: Build SANON APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'sanon/**'
      - 'tools/**'
      - '.github/workflows/build-sanon.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.11.1/bin >> $GITHUB_PATH
      - name: Download real public photos
        run: |
          python3 -m pip install --quiet requests pillow
          python3 tools/download_public_photos.py
      - name: Build release APK
        run: gradle --no-daemon :sanon:assembleRelease
      - name: Verify APK
        run: |
          APK=$(find sanon/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          test -n "$APK"
          test -s "$APK"
          test $(stat -c%s "$APK") -le 52428800
          unzip -t "$APK" >/dev/null
          mkdir -p dist
          cp "$APK" dist/SANON.apk
          file dist/SANON.apk
          ls -lh dist/SANON.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SANON-APK
          path: dist/SANON.apk
          if-no-files-found: error
      - name: Publish direct APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          name: SANON v1.0.${{ github.run_number }}
          files: dist/SANON.apk
          generate_release_notes: false
          make_latest: true
