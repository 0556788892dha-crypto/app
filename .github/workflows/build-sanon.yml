name: Build SANON APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'sanon/**'
      - 'tools/**'
      - '.github/workflows/build-sanon.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.11.1/bin >> $GITHUB_PATH
      - name: Download real public photos
        run: |
          python3 -m pip install --quiet requests pillow
          python3 tools/download_public_photos.py
      - run: yes | sdkmanager --licenses > /dev/null || true
      - name: Build signed release APK
        run: gradle --no-daemon :sanon:assembleRelease
      - name: Verify APK
        run: |
          APK=$(find sanon/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          test -s "$APK"
          test $(stat -c%s "$APK") -le 52428800
          file "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK=$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SANON-release
          path: sanon/build/outputs/apk/release/*.apk
          if-no-files-found: error
