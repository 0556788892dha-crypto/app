name: Build SANON APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'sanon/**'
      - '.github/workflows/build-sanon.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.11.1/bin >> $GITHUB_PATH
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: gradle --no-daemon :sanon:assembleRelease
      - run: |
          ls -lh sanon/build/outputs/apk/release/*.apk
          test $(stat -c%s sanon/build/outputs/apk/release/*.apk) -le 52428800
      - uses: actions/upload-artifact@v4
        with:
          name: SANON-release
          path: sanon/build/outputs/apk/release/*.apk
