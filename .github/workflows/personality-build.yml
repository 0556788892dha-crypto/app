name: Build DA Personality
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - "personality/**"
      - ".github/workflows/personality-build.yml"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
  workflow_dispatch:

jobs:
  build-personality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build DA Personality release
        run: gradle --no-daemon :personality:assembleRelease
      - name: Verify APK
        run: |
          test -s personality/build/outputs/apk/release/personality-release.apk
          ls -lh personality/build/outputs/apk/release/personality-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DA-PERSONALITY-release
          path: personality/build/outputs/apk/release/personality-release.apk
          if-no-files-found: error
