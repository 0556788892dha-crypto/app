name: Build Android apps
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Refresh DA OSIRIS offline snapshot
        run: python3 osiris/tools/fetch_snapshot.py
      - name: Build all debug APKs
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: David-Notes-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DA-PHONES-debug
          path: phonecatalog/build/outputs/apk/debug/phonecatalog-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DA-PERSONALITY-debug
          path: personality/build/outputs/apk/debug/personality-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DA-OSIRIS-debug
          path: osiris/app/build/outputs/apk/debug/app-debug.apk
