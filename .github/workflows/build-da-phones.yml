name: Build DA PHONES APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'phonecatalog/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-da-phones.yml'
      - '.github/scripts/build_catalog.py'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build offline catalog
        run: python .github/scripts/build_catalog.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :phonecatalog:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DA-PHONES-offline-release
          path: phonecatalog/build/outputs/apk/release/*.apk
          if-no-files-found: error
