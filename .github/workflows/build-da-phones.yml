name: Build DA DIGITAL APK
# v2.0 verification pipeline
permissions:
  contents: write

concurrency:
  group: da-phones-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'phonecatalog/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-da-phones.yml'
      - '.github/scripts/build_catalog.py'
      - '.github/scripts/audit_catalog.py'
      - '.github/scripts/niche_devices.json'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Get GSMArena scraped dataset
        run: git clone --depth 1 https://github.com/bytecharts/device_specs_gsmarena.git .cache/device_specs_gsmarena
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build offline catalog
        run: python .github/scripts/build_catalog.py
      - name: Audit catalog
        run: python .github/scripts/audit_catalog.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :phonecatalog:assembleRelease --stacktrace
      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find phonecatalog/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.da.phones'"
          sha256sum "$APK" | tee DA-DIGITAL-SHA256.txt

      - name: Publish direct APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find phonecatalog/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if gh release view da-digital-v2.0 >/dev/null 2>&1; then
            gh release upload da-digital-v2.0 "$APK" DA-DIGITAL-SHA256.txt --clobber
          else
            gh release create da-digital-v2.0 "$APK" DA-DIGITAL-SHA256.txt \
              --title "DA DIGITAL v2.0" \
              --notes "Verified offline DA DIGITAL APK. Built by GitHub Actions from the repository source."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DA-DIGITAL-offline-release-v2.0
          path: phonecatalog/build/outputs/apk/release/*.apk
          if-no-files-found: error
