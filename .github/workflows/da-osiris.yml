name: DA OSIRIS APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'osiris/**'
      - 'settings.gradle'
      - '.github/workflows/da-osiris.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Fetch OSIRIS snapshot
        run: python3 osiris/tools/fetch_snapshot.py
      - name: Build DA OSIRIS APK
        working-directory: osiris
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -s osiris/app/build/outputs/apk/debug/app-debug.apk
          ls -lh osiris/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload DA OSIRIS APK
        uses: actions/upload-artifact@v4
        with:
          name: DA-OSIRIS-debug
          path: osiris/app/build/outputs/apk/debug/app-debug.apk

# DA OSIRIS build verification
