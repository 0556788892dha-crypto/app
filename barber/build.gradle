plugins { id 'com.android.application' }
android {
    namespace 'com.dabarber.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.dabarber.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
