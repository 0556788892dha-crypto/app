plugins {
    id 'com.android.application'
}

android {
    namespace 'com.da.phones'
    compileSdk 35

    defaultConfig {
        applicationId 'com.da.phones'
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName '1.43'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
