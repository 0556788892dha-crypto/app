plugins {
    id 'com.android.application'
}
android {
    namespace 'com.david.phonecatalog'
    compileSdk 35
    defaultConfig {
        applicationId 'com.david.phonecatalog'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}