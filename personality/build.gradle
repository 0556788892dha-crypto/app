plugins {
    id 'com.android.application'
}

android {
    namespace 'com.da.personality'
    compileSdk 35

    defaultConfig {
        applicationId 'com.da.personality.final'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.4'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:face-detection:16.1.7'
}
