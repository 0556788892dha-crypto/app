plugins {
    id 'com.android.application'
}

android {
    namespace 'com.da.personality'
    compileSdk 35

    defaultConfig {
        applicationId 'com.da.personality.app15'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.6'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:face-detection:16.1.7'
}
